name: Edu CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: edu_test
          POSTGRES_USER: edu_test
          POSTGRES_PASSWORD: edu_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U edu_test -d edu_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      NODE_ENV: test
      PORT: 5050
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: edu_test
      DB_USER: edu_test
      DB_PASSWORD: edu_test
      CORS_ORIGIN: http://localhost:5173
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install backend dependencies
        working-directory: backend
        run: npm install
      - name: Initialize test database
        run: PGPASSWORD=edu_test psql -h localhost -U edu_test -d edu_test -f database/init.sql
      - name: Run backend tests
        working-directory: backend
        run: npm test

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install
      - name: Build frontend
        working-directory: frontend
        run: npm run build
