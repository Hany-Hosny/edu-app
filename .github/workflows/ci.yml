name: Edu CI
on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16

        env:
          POSTGRES_USER: edu_test
          POSTGRES_PASSWORD: edu_test
          POSTGRES_DB: edu_test

        ports:
          - 5432:5432

        options: >-
          --health-cmd="pg_isready -U edu_test -d edu_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      NODE_ENV: test
      PORT: 5050
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: edu_test
      DB_USER: edu_test
      DB_PASSWORD: edu_test
      CORS_ORIGIN: http://localhost:5173

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install backend dependencies
        run: npm ci --workspace backend --include-workspace-root=false

      - name: initialize test database
        run: PGPASSWORD=edu_test psql -h localhost -U edu_test -d edu_test -f database/init.sql

      - name: Run backend tests
        run: npm test --workspace backend

  frontend-test:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: install frontend dependencies
        run: npm ci --workspace frontend --include-workspace-root=false

      - name: Install Rolldown native binding
        run: npm install --no-save --package-lock=false --workspace frontend @rolldown/binding-linux-x64-gnu
      
      - name: Build frontend
        run: npm run build --workspace frontend 

  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest

    needs:
      - backend-test
      - frontend-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -f backend/Dockerfile -t edu-backend:${{ github.sha }} .

      - name: Build frontend image
        run: docker build -f frontend/Dockerfile -t edu-frontend:${{ github.sha }} .
      
